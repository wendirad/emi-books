name: emi_books
description: >-
  AI-powered study companion for Ethiopian high school students.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  cloud_firestore: ^6.0.3
  equatable: ^3.0.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_modular: ^7.1.1
  flutter_svg: ^2.2.1
  font_awesome_flutter: ^11.0.0
  fpdart: ^1.1.1
  google_fonts: ^9.0.0
  google_nav_bar: ^5.0.7
  image_picker: ^1.1.2
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  loading_animation_widget: ^1.3.0
  material_ui: ^1.5.0
  mime: ^2.0.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.0
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/illustrations/
    - assets/splash/
    - google_fonts/
